name: Prepare Quick Ask release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional preview tag, for example 1.1.0-beta.1 (blank for stable version)'
        type: string
        required: false
        default: ''
      prerelease:
        description: 'Prepare a preview release; never mark it as Latest'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  QUICK_ASK_RELEASE_TAG: ${{ inputs.release_tag }}
  QUICK_ASK_PRERELEASE: ${{ inputs.prerelease }}
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild installation assets
        run: npm run build
      - run: npm test
      - run: npm run release:check
      - name: Attest the exact installation files
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Record private preparation limitation
        if: ${{ github.event.repository.private }}
        run: echo 'Private preparation draft; rerun after making the repository public to attest the installation assets.' >> "$GITHUB_STEP_SUMMARY"
      - name: Create or refresh draft from the same files
        run: npm run release:draft
        env:
          GH_TOKEN: ${{ github.token }}
          QUICK_ASK_ATTESTED: ${{ !github.event.repository.private }}

name: Prepare Quick Ask release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:draft
        env:
          GH_TOKEN: ${{ github.token }}
